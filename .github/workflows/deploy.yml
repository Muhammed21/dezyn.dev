name: Deploy

# Une CI verte sur main migre la base de production, déploie le Worker dezyn-api, puis vérifie /health ;
# un /health en échec remet la version précédente (ADR 0034). Le Worker dezyn-purge se déploie ensuite,
# quand PURGE_DEPLOY_ENABLED vaut true (ADR 0042). L'app web est construite pour api.dezyn.dev et
# déployée sur app.dezyn.dev ; une adresse profonde qui ne sert pas l'app remet la version précédente
# (ADR 0045). Le Worker dezyn-preview-router se déploie ensuite, avec le jeton et le sous-domaine
# workers.dev de l'environnement preview. Un commit dépassé par un plus récent ne déploie pas.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Production
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head: ${{ steps.latest.outputs.head }}
    environment:
      name: production
      url: https://api.dezyn.dev
    env:
      HEALTH_URL: https://api.dezyn.dev/health
      WEB_CHECK_URL: https://app.dezyn.dev/espaces/00000000-0000-4000-8000-000000000000
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - id: latest
        name: Still the head of main
        run: |
          git fetch --no-tags --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$HEAD_SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer the head of main; the run of the newer commit deploys."
            echo "head=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.latest.outputs.head == 'true'
        uses: ./.github/actions/install
      - name: Migrate
        if: steps.latest.outputs.head == 'true'
        run: pnpm migrate
        env:
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
      - id: deploy
        name: Deploy
        if: steps.latest.outputs.head == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --message "$HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - id: health
        name: Health check
        if: steps.latest.outputs.head == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" && exit 0
            sleep 6
          done
          echo "::error::$HEALTH_URL does not answer 200 after the deploy."
          exit 1
      - name: Deploy purge Worker
        if: steps.latest.outputs.head == 'true' && vars.PURGE_DEPLOY_ENABLED == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --config wrangler.purge.jsonc --message "$HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build web app
        if: steps.latest.outputs.head == 'true'
        run: pnpm --filter @repo/web build
        env:
          VITE_API_URL: https://api.dezyn.dev
      - name: Deploy web app
        if: steps.latest.outputs.head == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --message "$HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - id: web
        name: Web app check
        if: steps.latest.outputs.head == 'true'
        run: |
          page="$RUNNER_TEMP/web-page.html"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 --output "$page" "$WEB_CHECK_URL" &&
              grep -q 'id="root"' "$page"; then
              exit 0
            fi
            sleep 6
          done
          echo "::error::$WEB_CHECK_URL does not serve the web app after the deploy."
          exit 1
      - name: Roll back web app
        if: failure() && steps.web.outcome == 'failure'
        working-directory: apps/web
        run: pnpm exec wrangler rollback --yes --message "web app check failed for $HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Roll back
        if: failure() && steps.health.outcome == 'failure'
        working-directory: apps/api
        run: pnpm exec wrangler rollback --yes --message "health check failed for $HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  preview-router:
    name: Preview router
    needs: production
    if: needs.production.outputs.head == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CHECK_URL: https://router-check-preview.dezyn.dev/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: ./.github/actions/install
      - name: Deploy
        working-directory: apps/preview-router
        run: pnpm exec wrangler deploy --message "$HEAD_SHA" --var "WORKERS_SUBDOMAIN:$WORKERS_SUBDOMAIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      - name: Router check
        run: |
          page="$RUNNER_TEMP/router-page.txt"
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --max-time 10 --output "$page" --write-out '%{http_code}' "$CHECK_URL" || true)
            if [ "$status" = 404 ] && grep -q 'No preview on this host' "$page"; then
              exit 0
            fi
            sleep 6
          done
          echo "::error::$CHECK_URL is not answered by the preview router after the deploy."
          exit 1
